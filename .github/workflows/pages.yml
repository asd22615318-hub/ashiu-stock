name: Update stock screener data
on:
  workflow_dispatch:
  push:
    paths:
      - convertible_data.py
      - cb_daily.py
      - institutional_data.py
      - ownership_data.py
      - cb_chip_data.py
  schedule:
    - cron: '50 8 * * *'
    - cron: '40 10 * * *'
permissions:
  contents: write
concurrency:
  group: market-data-update
  cancel-in-progress: false
jobs:
  update:
    if: github.event.schedule != '40 10 * * *'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update official reports and preserve history
        env:
          ASHIU_SKIP_CB_DAILY: '1'
        run: python build.py
      - name: Preserve snapshots for the protected Cloudflare build
        shell: pwsh
        run: |
          Copy-Item -LiteralPath dist/market-data.json.gz -Destination seed.json.gz
          Copy-Item -LiteralPath dist/institutional-data.json -Destination institutional-seed.json
          Copy-Item -LiteralPath dist/ownership-data.json -Destination ownership-seed.json
          Copy-Item -LiteralPath dist/cb-chip-data.json -Destination cb-chip-seed.json
          Copy-Item -LiteralPath dist/regulatory-data.json -Destination regulatory-seed.json
          Copy-Item -LiteralPath dist/revenue-data.json -Destination revenue-seed.json
          Copy-Item -LiteralPath dist/convertible-data.json -Destination convertible-seed.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $snapshots = @('seed.json.gz', 'institutional-seed.json', 'ownership-seed.json', 'cb-chip-seed.json', 'regulatory-seed.json', 'revenue-seed.json', 'convertible-seed.json', 'etf-seed.json', 'prison-seed.json')
          $saved = Join-Path $env:RUNNER_TEMP 'market-snapshots'
          New-Item -ItemType Directory -Path $saved -Force | Out-Null
          foreach ($file in $snapshots) { Copy-Item -LiteralPath $file -Destination (Join-Path $saved $file) }
          for ($attempt = 0; $attempt -lt 3; $attempt++) {
            git fetch origin main
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git reset --hard origin/main
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            foreach ($file in $snapshots) { Copy-Item -LiteralPath (Join-Path $saved $file) -Destination $file }
            git add -- $snapshots
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($LASTEXITCODE -ne 1) { exit $LASTEXITCODE }
            git commit -m 'Update official market snapshots'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { exit 0 }
          }
          throw 'Could not publish market snapshots after three attempts.'
          exit 0

  disposal:
    if: github.event.schedule == '40 10 * * *'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh evening official disposal notices
        run: python prison_data.py
      - name: Save disposal snapshot
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prison-seed.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m 'Update official disposal snapshot'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git pull --rebase origin main
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } elseif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          exit 0
