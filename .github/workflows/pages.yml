name: Update stock screener data
on:
  workflow_dispatch:
  schedule:
    - cron: '30 9 * * *'
permissions:
  contents: write
concurrency:
  group: market-data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update official reports and preserve history
        run: python build.py
      - name: Preserve snapshots for the protected Cloudflare build
        shell: pwsh
        run: |
          Copy-Item -LiteralPath dist/market-data.json.gz -Destination seed.json.gz
          Copy-Item -LiteralPath dist/institutional-data.json -Destination institutional-seed.json
          Copy-Item -LiteralPath dist/ownership-data.json -Destination ownership-seed.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add seed.json.gz institutional-seed.json ownership-seed.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m 'Update official market snapshots'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } elseif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          exit 0
