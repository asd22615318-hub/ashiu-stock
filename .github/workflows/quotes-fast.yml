name: Refresh closing quotes quickly
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/quotes-fast.yml
  schedule:
    # Asia/Taipei 17:10, 17:40, 18:10, 18:40, 19:10, 19:40.
    - cron: '10,40 9-11 * * 1-5'
permissions:
  contents: write
concurrency:
  group: quotes-fast
  cancel-in-progress: false
jobs:
  quotes:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh official closing quotes
        run: python refresh_quotes.py
      - name: Publish quotes before auxiliary reports
        run: python publish_snapshots.py seed.json.gz taiwan-sentiment-seed.json
