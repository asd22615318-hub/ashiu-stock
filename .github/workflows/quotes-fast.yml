name: Refresh closing quotes quickly
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/quotes-fast.yml
  schedule:
    # Asia/Taipei 17:10 to 21:10, every 30 minutes on weekdays.
    - cron: '10,40 9-12 * * 1-5'
    - cron: '10 13 * * 1-5'
permissions:
  contents: write
  checks: read
concurrency:
  group: quotes-fast
  cancel-in-progress: false
jobs:
  quotes:
    runs-on: windows-latest
    timeout-minutes: 22
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh official closing quotes
        run: python refresh_quotes.py
      - name: Publish quotes before auxiliary reports
        run: python publish_snapshots.py seed.json.gz taiwan-sentiment-seed.json
      - name: Confirm the Cloudflare deployment
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $revision = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or !$revision) { throw 'Cannot identify the published revision.' }
          $url = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/commits/$revision/check-runs"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $deadline = (Get-Date).AddMinutes(8)
          do {
            $result = Invoke-RestMethod -Uri $url -Headers $headers -TimeoutSec 20
            $build = $result.check_runs |
              Where-Object { $_.name -eq 'Workers Builds: ashiu-stock-private' } |
              Sort-Object id -Descending | Select-Object -First 1
            if ($build.status -eq 'completed') {
              if ($build.conclusion -ne 'success') { throw "Cloudflare deployment ended with $($build.conclusion) for $revision." }
              Write-Host "Cloudflare deployment succeeded for $revision."
              exit 0
            }
            Start-Sleep -Seconds 15
          } while ((Get-Date) -lt $deadline)
          throw "Cloudflare deployment was not confirmed for $revision within eight minutes. Check Workers Builds."
