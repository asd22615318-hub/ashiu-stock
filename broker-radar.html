<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阿修｜分點雷達測試版</title><style>body{background:#101b2c;color:#e8f1f1;font:16px system-ui;margin:0;padding:24px}main{max-width:1100px;margin:auto}a{color:#65dcc5}section{background:#1c2a3a;border-radius:16px;padding:20px;margin:16px 0}input{margin:8px}table{border-collapse:collapse;width:100%;min-width:650px}th,td{padding:10px;border-bottom:1px solid #415064;text-align:left}.scroll{overflow:auto}small{color:#bbcbd0}</style><main><a href="./">← 返回選股工作台</a><h1>主力分點雷達｜免費 CSV 測試版</h1><p>僅匯入你有合法使用權的資料。本頁不會繞過驗證碼，也不會將檔案上傳伺服器。</p><section><label>選擇 UTF-8 CSV <input id="file" type="file" accept=".csv,text/csv"></label><p><small>必要欄位：date,stock_id,securities_trader_id,buy,sell；可選 securities_trader。買賣量單位需一致。完整交易日缺漏會使隔日估計失真。</small></p><label><input type="radio" name="mode" value="day" checked>隔日沖前20名</label><label><input type="radio" name="mode" value="swing">波段前20名</label><label><input type="radio" name="mode" value="stock">個股分點</label><input id="stock" placeholder="輸入股票代號，如 3008" aria-label="股票代號"><p id="status" role="status">尚未匯入資料；不顯示假排名。</p></section><section class="scroll"><table><thead><tr><th>分點</th><th>分點代號</th><th>股票</th><th>買超事件數</th><th>隔日沖分</th><th>波段分</th><th>累計淨買超</th></tr></thead><tbody id="results"></tbody></table></section><p><small>注意：分點包含多位客戶，無法辨識真正持股天數；此版為研究測試，不能用於實際交易判斷。跨股票的分點總排名及完整交易日曆驗證尚待完成。</small></p></main><script type="module" src="./broker-radar-ui.js"></script></html>
